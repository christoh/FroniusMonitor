# Mosquitto (eclipse-mosquitto 2.x) as the MQTT broker between the FRITZ!Box (USP agent) and the USP controllers.
# Goes to <volume>/config/mosquitto.conf. See ../README.md.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
# Who subscribes to what. That shows which of its two topics the box listens on.
log_type subscribe
log_type unsubscribe
connection_messages true

# network_mode: host, so this is port 1883 on every interface of the docker host.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
