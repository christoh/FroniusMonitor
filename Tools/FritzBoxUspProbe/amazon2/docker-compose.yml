# /opt/mosquitto/docker-compose.yml on amazon2.hochstaetter.de: Mosquitto as the MQTT broker for USP (TR-369)
# between the FRITZ!Box in Neufahrn and the home automation. See ../README.md.
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "8883:8883"            # TLS only, from the internet (security group mosquitto-mqtts)
      - "127.0.0.1:1883:1883"  # without TLS, from this host only
    volumes:
      - ./config:/mosquitto/config
      - ./certs:/mosquitto/certs:ro
      - ./data:/mosquitto/data
