# /opt/mosquitto/config/mosquitto.conf on amazon2.hochstaetter.de. See ../../README.md.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Every listener: no anonymous clients, a password per client, and what it may use in the ACL.
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# From the internet, TLS only. The certificate is the one certbot renews for nginx.kartellvz, copied by
# /opt/mosquitto/update-cert.sh.
listener 8883
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2

# Without TLS, published on 127.0.0.1 only (see docker-compose.yml).
listener 1883
